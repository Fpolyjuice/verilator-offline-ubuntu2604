name: Build Yosys+OpenSTA offline bundle (Ubuntu 26.04)

on:
  workflow_dispatch:

jobs:
  build-bundle:
    runs-on: ubuntu-26.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # 在干净容器中下载 .deb，避免 Runner 预装软件导致漏包
      - name: Download .deb dependencies in clean container
        run: |
          docker run --rm \
            -v "$PWD/debs:/out" \
            ubuntu:26.04 \
            bash -c '
              set -e
              apt-get update
              apt-get install -y --download-only \
                build-essential clang lld bison flex swig \
                libreadline-dev gawk tcl-dev libffi-dev tcl-tclreadline \
                zlib1g-dev libeigen3-dev libboost-system-dev libboost-python-dev libboost-filesystem-dev \
                git make graphviz xdot pkg-config python3
              cp /var/cache/apt/archives/*.deb /out/
            '

      - name: Download Yosys source (with submodules)
        run: |
          mkdir -p src
          git clone --recursive --depth=1 https://github.com/YosysHQ/yosys.git src/yosys
          cd src/yosys
          git rev-parse HEAD > ../../yosys-commit.txt

      - name: Download OpenSTA source
        run: |
          git clone --depth=1 https://github.com/The-OpenROAD-Project/OpenSTA.git src/OpenSTA
          cd src/OpenSTA
          git rev-parse HEAD > ../../opensta-commit.txt

      - name: Download CUDD 3.0.0 source
        run: |
          wget -O src/cudd-3.0.0.tar.gz \
            https://raw.githubusercontent.com/davidkebo/cudd/main/cudd_versions/cudd-3.0.0.tar.gz

      - name: Generate SHA256SUMS and package inventory
        run: |
          cd debs
          sha256sum *.deb > ../SHA256SUMS
          for f in *.deb; do
            dpkg-deb -f "$f" Package Version Architecture >> ../package-inventory.tsv
          done
          cd ..
          ls debs/*.deb | xargs -n1 basename > package-list.txt

      - name: Prepare bundle directory
        run: |
          mkdir -p bundle
          cp -r debs bundle/
          cp -r src bundle/
          cp SHA256SUMS package-inventory.tsv package-list.txt yosys-commit.txt opensta-commit.txt bundle/
          cp install_deps.sh bundle/
          cp build-cudd.sh bundle/
          cp build-yosys.sh bundle/
          cp build-opensta.sh bundle/

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: yosys-opensta-offline-ubuntu2604-amd64
          path: bundle/
          retention-days: 30
